name: Feature request
description: Propose a new capability or an improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this change address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, configuration, or API you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds, competing designs, or reasons to keep the status quo.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, mockups, or related issues. Do not include secrets.
