name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit workspace lockfile
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-audit for examples
        run: cargo install cargo-audit --locked

      - name: Audit example lockfiles
        run: |
          cargo audit --file examples/plugins/hello/Cargo.lock
          cargo audit --file examples/plugins/workspaces/Cargo.lock

  policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check licenses, sources, bans, and advisories
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete

      - name: Check for unused dependencies
        run: |
          cargo machete
          cargo machete examples/plugins/hello/Cargo.toml examples/plugins/workspaces/Cargo.toml
