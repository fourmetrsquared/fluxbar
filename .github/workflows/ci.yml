name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting, lints, examples, and tests
        run: ./build.sh check

  msrv:
    name: MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check the workspace with the MSRV
        run: cargo check --workspace --locked

      - name: Check example plugins with the MSRV
        run: |
          cargo check --manifest-path examples/plugins/hello/Cargo.toml --locked
          cargo check --manifest-path examples/plugins/workspaces/Cargo.toml --locked

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Markdown links
        run: python3 scripts/check_markdown_links.py
