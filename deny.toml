# cargo-deny policy for FluxBar.
#
# Run locally with:
#   cargo deny check
#
# See docs/SAFETY.md for the unsafe-code policy and docs/RELEASE.md for the
# release checklist.

[graph]
all-features = false
no-default-features = false

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
