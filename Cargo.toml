[workspace]
resolver = "2"
members = [
    "fluxbar-core",
    "fluxbar-sdk",
    "fluxbar-macos",
    "fluxbar-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["FluxBar Contributors"]
license = "MIT"
repository = "https://github.com/fourmetrsquared/fluxbar"
description = "FluxBar: Next-Generation Status Bar in Rust"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Errors
anyhow = "1.0"
thiserror = "2.0"

# Utilities
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
fs2 = "0.4"
glob = "0.3"
sysinfo = "0.33"

# Testing
tempfile = "3.13"

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 4
strip = "symbols"
panic = "abort"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
